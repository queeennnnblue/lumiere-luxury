<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LOMOND — The Golden Hour Collection</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  .page {
    width:1080px; height:1350px; position:relative; overflow:hidden;
    background:linear-gradient(158deg,#faf4ea 0%,#f2e8d8 45%,#e9dcc6 100%);
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  }
  .frame { position:absolute; inset:28px; border:2px solid #c9a55c; }
  .frame-inner { position:absolute; inset:40px; border:1px solid rgba(77,12,17,.4); }
  .kick {
    position:absolute; top:66px; width:100%; text-align:center;
    font-size:20px; letter-spacing:10px; color:#4d0c11; text-transform:uppercase; opacity:.8;
  }
  .logo { position:absolute; top:104px; left:340px; width:400px; }
  .sub {
    position:absolute; top:222px; width:100%; text-align:center;
    font-size:25px; letter-spacing:3px; color:#8a7a70;
  }
  .grid {
    position:absolute; top:286px; left:90px; width:900px;
    display:grid; grid-template-columns:repeat(3,1fr); gap:24px;
  }
  .grid img {
    width:284px; height:284px; object-fit:cover; display:block;
    border:3px solid #c9a55c; border-radius:8px;
  }
  .divider {
    position:absolute; bottom:160px; left:340px; width:400px; text-align:center;
    color:#4d0c11; font-size:20px; letter-spacing:6px;
    border-top:1px solid #c9a55c; padding-top:12px;
  }
  .footer {
    position:absolute; bottom:88px; width:100%; text-align:center;
    font-size:23px; letter-spacing:9px; color:#4d0c11; text-transform:uppercase; opacity:.85;
  }
</style>
</head>
<body>
<div class="page" data-document-role="page" data-label="LOMOND — The Golden Hour Collection">
  <div class="frame"></div>
  <div class="frame-inner"></div>
  <div class="kick">Fine Jewelry</div>
  <img class="logo" src="https://raw.githubusercontent.com/queeennnnblue/lumiere-luxury/claude/uniform-product-photography-84kzkb/store-assets/brand/lomond_logo.png" alt="LOMOND">
  <div class="sub">The Golden Hour Collection — مجموعة الساعة الذهبية</div>
  <div class="grid">
    <img src="https://raw.githubusercontent.com/queeennnnblue/lumiere-luxury/claude/uniform-product-photography-84kzkb/store-assets/products-web/lomond_01.jpg" alt="N°01">
    <img src="https://raw.githubusercontent.com/queeennnnblue/lumiere-luxury/claude/uniform-product-photography-84kzkb/store-assets/products-web/lomond_04.jpg" alt="N°04">
    <img src="https://raw.githubusercontent.com/queeennnnblue/lumiere-luxury/claude/uniform-product-photography-84kzkb/store-assets/products-web/lomond_22.jpg" alt="N°22">
    <img src="https://raw.githubusercontent.com/queeennnnblue/lumiere-luxury/claude/uniform-product-photography-84kzkb/store-assets/products-web/lomond_36.jpg" alt="N°36">
    <img src="https://raw.githubusercontent.com/queeennnnblue/lumiere-luxury/claude/uniform-product-photography-84kzkb/store-assets/products-web/lomond_44.jpg" alt="N°44">
    <img src="https://raw.githubusercontent.com/queeennnnblue/lumiere-luxury/claude/uniform-product-photography-84kzkb/store-assets/products-web/lomond_45.jpg" alt="N°45">
  </div>
  <div class="divider">◆</div>
  <div class="footer">Fine Jewelry House</div>
</div>
</body>
</html>

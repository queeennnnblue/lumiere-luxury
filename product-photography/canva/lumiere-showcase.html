<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LUMIÈRE — The Golden Hour Collection</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  .page {
    width:1080px; height:1350px; position:relative; overflow:hidden;
    background:linear-gradient(158deg,#fdf9ef 0%,#f8f0dd 40%,#f0e2c4 100%);
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  }
  .frame { position:absolute; inset:28px; border:2px solid #c9a55c; }
  .frame-inner { position:absolute; inset:40px; border:1px solid rgba(154,123,58,.5); }
  .kick {
    position:absolute; top:64px; width:100%; text-align:center;
    font-size:20px; letter-spacing:10px; color:#9a7b3a; text-transform:uppercase;
  }
  h1 {
    position:absolute; top:96px; width:100%; text-align:center;
    font-size:76px; letter-spacing:16px; color:#2a2420; font-weight:700;
  }
  h1 span { color:#c9a55c; }
  .sub {
    position:absolute; top:196px; width:100%; text-align:center;
    font-size:26px; letter-spacing:4px; color:#8a8178;
  }
  .grid {
    position:absolute; top:264px; left:90px; width:900px;
    display:grid; grid-template-columns:repeat(3,1fr); gap:24px;
  }
  .grid img {
    width:284px; height:284px; object-fit:cover; display:block;
    border:3px solid #c9a55c; border-radius:8px;
  }
  .divider {
    position:absolute; bottom:170px; left:340px; width:400px; text-align:center;
    color:#c9a55c; font-size:22px; letter-spacing:6px;
    border-top:1px solid #c9a55c; padding-top:14px;
  }
  .footer {
    position:absolute; bottom:92px; width:100%; text-align:center;
    font-size:24px; letter-spacing:8px; color:#9a7b3a; text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="page" data-document-role="page" data-label="LUMIÈRE — The Golden Hour Collection">
  <div class="frame"></div>
  <div class="frame-inner"></div>
  <div class="kick">Fine Jewelry</div>
  <h1>LUMI<span>È</span>RE</h1>
  <div class="sub">The Golden Hour Collection — مجموعة الساعة الذهبية</div>
  <div class="grid">
    <img src="https://raw.githubusercontent.com/queeennnnblue/lumiere-luxury/claude/uniform-product-photography-84kzkb/store-assets/products-web/lumiere_01.jpg" alt="N°01">
    <img src="https://raw.githubusercontent.com/queeennnnblue/lumiere-luxury/claude/uniform-product-photography-84kzkb/store-assets/products-web/lumiere_04.jpg" alt="N°04">
    <img src="https://raw.githubusercontent.com/queeennnnblue/lumiere-luxury/claude/uniform-product-photography-84kzkb/store-assets/products-web/lumiere_22.jpg" alt="N°22">
    <img src="https://raw.githubusercontent.com/queeennnnblue/lumiere-luxury/claude/uniform-product-photography-84kzkb/store-assets/products-web/lumiere_36.jpg" alt="N°36">
    <img src="https://raw.githubusercontent.com/queeennnnblue/lumiere-luxury/claude/uniform-product-photography-84kzkb/store-assets/products-web/lumiere_44.jpg" alt="N°44">
    <img src="https://raw.githubusercontent.com/queeennnnblue/lumiere-luxury/claude/uniform-product-photography-84kzkb/store-assets/products-web/lumiere_45.jpg" alt="N°45">
  </div>
  <div class="divider">◆</div>
  <div class="footer">Luxury Designs</div>
</div>
</body>
</html>
